# SAAD-standard Compose file for an application with PostgreSQL, Redis and
# migrations. add-app.sh detects postgres/redis as infrastructure, "migrate" as
# the migration service and everything built from source as BUILD_SERVICES.
name: ${COMPOSE_PROJECT_NAME:-myapp}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    image: myapp-backend:${IMAGE_TAG:-local}
    env_file:
      # Optional so CI can validate and build without server secrets.
      - path: .env.production
        required: false
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: myapp-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      # Optional so CI can validate and build without server secrets.
      - path: .env.production
        required: false
    ports:
      - "127.0.0.1:18080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  frontend:
    build: ./frontend
    image: myapp-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:13080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  postgres_data:
