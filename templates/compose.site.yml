# Minimal SAAD-standard Compose file for a project without a database
# (site, bot, small service). Copy to the repository root as compose.yml.
name: ${COMPOSE_PROJECT_NAME:-landing}

services:
  web:
    build:
      context: .
    image: landing-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      # Optional so CI can validate and build without server secrets.
      - path: .env.production
        required: false
    # Only the host Nginx reaches the service.
    ports:
      - "127.0.0.1:13000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
